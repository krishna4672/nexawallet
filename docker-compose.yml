# ==============================================================================
# NexaWallet - Local Infrastructure Docker Compose Stack
# Includes PostgreSQL 16, Redis 7, Apache Kafka (KRaft), and Elasticsearch 8.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 - Single Source of Truth for Financial Records
  # ----------------------------------------------------------------------------
  nexa-postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexawallet}
      POSTGRES_USER: ${POSTGRES_USER:-nexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa_dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexa_user} -d ${POSTGRES_DB:-nexawallet}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexa-network

  # ----------------------------------------------------------------------------
  # Redis 7 - Fast Cache & Sliding-Window Rate Limiter
  # ----------------------------------------------------------------------------
  nexa-redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    # Phase 5: read-through cache (user profile) + distributed sliding-window rate limiter state.
    # --requirepass "" (the default when REDIS_PASSWORD is unset) disables password auth, matching
    # local dev; set REDIS_PASSWORD in .env to require one. Not exposed publicly by default — the
    # published port binds to the host's own interfaces only, same as the other local-dev services.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nexa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexa-network

  # ----------------------------------------------------------------------------
  # Apache Kafka 7.5.0 (KRaft Mode - No Zookeeper Dependency)
  # Provides reliable event streaming for transactional outbox pattern.
  # ----------------------------------------------------------------------------
  nexa-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexa-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # Dual-listener setup:
      # - PLAINTEXT (nexa-kafka:29092) for container-to-container communication
      # - PLAINTEXT_HOST (localhost:9092) for host machine development
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://nexa-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@nexa-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - nexa_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - nexa-network

  # ----------------------------------------------------------------------------
  # Elasticsearch 8.11.1 - Phase 6 Service-Point Geo Search (derived index; PostgreSQL is
  # authoritative — see README). Single-node, local development only: no replica shards, no HA.
  # WARNING: Security is disabled below for local development convenience ONLY.
  # Do NOT deploy to production without TLS certificates and user authentication.
  # The published port binds to the host's own interfaces only (same as every other service in
  # this file) — it is not exposed publicly by this compose file.
  # ----------------------------------------------------------------------------
  nexa-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: nexa-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - nexa_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - nexa-network

volumes:
  nexa_pgdata:
    driver: local
  nexa_redisdata:
    driver: local
  nexa_kafkadata:
    driver: local
  nexa_esdata:
    driver: local

networks:
  nexa-network:
    driver: bridge
